services:
  awghop:
    build: .
    image: awghop:dev
    ports:
      - "127.0.0.1:8080:8080"
      - "51820:51820/udp"
    environment:
      AWGHOP_LISTEN: ":8080"
      AWGHOP_DATA: /data
      AWGHOP_LOG_FORMAT: text
      AWGHOP_LOG_LEVEL: info
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - awghop-data:/data
    restart: unless-stopped

volumes:
  awghop-data:
