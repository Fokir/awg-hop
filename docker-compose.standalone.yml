# Минимальный standalone compose для быстрой пробной установки:
#  * образ из ghcr.io/fokir/awg-hop:latest (без локальной сборки),
#  * админка HTTP на 127.0.0.1:8080 (для production используйте reverse proxy с TLS,
#    см. docker-compose.example.yml),
#  * UDP 51820 — порт AmneziaWG (можно изменить через AWGHOP_PUBLIC_UDP_PORT).
#
# Запуск:
#   docker compose -f docker-compose.standalone.yml up -d
#
# Если порт 51820 уже занят (например, ранее стоял wg-easy):
#   AWGHOP_PUBLIC_UDP_PORT=51821 docker compose -f docker-compose.standalone.yml up -d
#
# По завершении работы:
#   docker compose -f docker-compose.standalone.yml down

services:
  awghop:
    image: ghcr.io/fokir/awg-hop:${AWGHOP_IMAGE_TAG:-latest}
    container_name: awghop
    ports:
      - "127.0.0.1:8080:8080"
      - "${AWGHOP_PUBLIC_UDP_PORT:-51820}:51820/udp"
    environment:
      AWGHOP_LISTEN: ":8080"
      AWGHOP_DATA: /data
      AWGHOP_LOG_FORMAT: json
      AWGHOP_LOG_LEVEL: info
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - awghop-data:/data
    restart: unless-stopped

volumes:
  awghop-data:
